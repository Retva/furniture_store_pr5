<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Мебельный магазин: каталог мебели и производителей">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>МебельДом</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f5f0e8;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    /* Заглушка до загрузки Flutter: вместо белого экрана. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #3e3429;
      z-index: 9999;
      transition: opacity 0.25s ease;
    }

    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading .brand {
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    #loading .hint {
      font-size: 0.95rem;
      opacity: 0.75;
    }

    #loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(62, 52, 41, 0.2);
      border-top-color: #3e3429;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite" aria-busy="true">
    <div class="brand">МебельДом</div>
    <div class="spinner" role="progressbar" aria-label="Загрузка приложения"></div>
    <div class="hint">Загружаем приложение…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('fade-out');
      setTimeout(function () { el.remove(); }, 280);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
